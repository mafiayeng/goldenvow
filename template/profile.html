{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h3 class="golden-text text-center">👤 My Profile</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control bg-dark text-light" value="{{ admin.username }}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control bg-dark text-light" value="{{ admin.email }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="tel" name="phone" class="form-control bg-dark text-light" value="{{ admin.phone or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Referral Code</label>
                    <input type="text" class="form-control bg-dark text-light" value="{{ admin.referral_code }}" disabled>
                    <small class="text-muted-light">Share this code with new admins to get referral benefits</small>
                </div>
                <hr>
                <h5 class="golden-text">🔑 Change Password</h5>
                <div class="mb-3">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="new_password" class="form-control bg-dark text-light" placeholder="Enter new password">
                </div>
                <button type="submit" class="btn btn-gold w-100">💾 Update Profile</button>
            </form>
        </div>
    </div>
</div>

<div class="mt-3 text-center">
    <a href="{{ url_for('dashboard') if not admin.is_super_admin else url_for('super_dashboard') }}" class="text-muted-light">← Back</a>
</div>
{% endblock %}
