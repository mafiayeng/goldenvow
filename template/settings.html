{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass p-4 p-md-5">
            <h2 class="text-center mb-4"><i class="fas fa-cog text-gold me-2"></i>Settings</h2>
            <form method="POST">
                {{ form.csrf_token }}
                <div class="mb-3 form-check">
                    {{ form.maintenance_mode(class="form-check-input") }}
                    {{ form.maintenance_mode.label(class="form-check-label") }}
                </div>
                <button type="submit" class="btn btn-gold w-100">Save Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
