{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h4 class="golden-text text-center">🔑 New Password</h4>
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control bg-dark text-light" placeholder="New password" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="confirm" class="form-control bg-dark text-light" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn btn-gold w-100">Update Password</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{{ url_for('login') }}" class="text-muted-light">← Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
