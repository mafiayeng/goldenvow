{% extends "base.html" %}
{% block title %}Request Withdrawal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass p-4 p-md-5">
            <h2 class="text-center mb-4"><i class="fas fa-hand-holding-usd text-gold me-2"></i>Request Withdrawal</h2>
            <form method="POST" action="{{ url_for('withdrawal_request') }}">
                {{ csrf_token() }}   <!-- ✅ This renders a hidden input -->
                <div class="mb-3">
                    <label class="form-label">Amount (KES)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="Min {{ minimum_withdrawal_fee }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="2547XX XXX XXX" required>
                </div>
                <button type="submit" class="btn btn-gold w-100">Submit Request</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
