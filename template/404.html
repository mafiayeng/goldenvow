{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center glass p-5" style="max-width: 600px; margin: 4rem auto;">
    <h1 class="display-4"><i class="fas fa-exclamation-triangle text-gold"></i> 404</h1>
    <p class="lead">Oops! The page you're looking for doesn't exist.</p>
    <p style="color: var(--text-muted);">It might have been moved or deleted.</p>
    <a href="{{ url_for('index') }}" class="btn btn-gold mt-3">Go Home</a>
</div>
{% endblock %}
