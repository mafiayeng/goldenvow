{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4">
            <h3 class="text-center golden-text">✦ Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light" required>
                </div>
                <button type="submit" class="btn btn-gold w-100">Login</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{{ url_for('forgot_password') }}" class="text-muted-light">Forgot password?</a><br>
                <small class="text-muted-light">Don't have an account? <a href="{{ url_for('register') }}" class="golden-text">Register</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
