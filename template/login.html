{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4">
            <h3 class="text-center golden-text">✦ Admin Login</h3>
            <hr>
            <form method="POST" autocomplete="on">
                <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" placeholder="Username" autocomplete="username" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required></div>
                <button type="submit" class="btn btn-gold w-100">Login</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/forgot-password">Forgot password?</a><br>
                <small>Don't have an account? <a href="{{ url_for('register') }}">Register</a></small>
                <hr>
                <small>Contributor? <a href="{{ url_for('contributor_login') }}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
