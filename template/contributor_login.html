{% extends "base.html" %}
{% block title %}Contributor Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h3 class="golden-text text-center">👤 Contributor Login</h3>
            <p class="text-muted-light text-center">Log in to view your contributions and download receipts.</p>
            <hr>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="remember" id="remember" class="form-check-input">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                {% if event_token %}
                <input type="hidden" name="event_token" value="{{ event_token }}">
                {% endif %}
                <button type="submit" class="btn btn-gold w-100">Login</button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-muted-light">Don't have an account? <a href="{{ url_for('contributor_register', event_token=event_token) }}" class="golden-text">Register</a></small>
            </div>
            <hr>
            <div class="text-center">
                <small class="text-muted-light">Admin? <a href="{{ url_for('login') }}" class="golden-text">Admin Login</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
