{% extends "base.html" %}
{% block title %}Admin Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4">
            <h3 class="text-center golden-text">✦ Create Admin Account</h3>
            <p class="text-muted-light text-center">Register to start creating events and managing contributions.</p>
            <hr>
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Phone</label>
                    <input type="tel" name="phone" class="form-control bg-dark text-light">
                </div>
                <div class="mb-2">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control bg-dark text-light" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Referral Code (optional)</label>
                    <input type="text" name="referral_code" class="form-control bg-dark text-light" placeholder="Enter code if you have one">
                </div>
                <div class="mb-3">
                    <label class="form-label">Super Admin Secret (if applicable)</label>
                    <input type="password" name="super_secret" class="form-control bg-dark text-light" placeholder="Only if you're the developer">
                </div>
                <button type="submit" class="btn btn-gold w-100">Register</button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-muted-light">Already have an account? <a href="{{ url_for('login') }}" class="golden-text">Login</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
