{% extends "base.html" %}
{% block title %}Create Event{% endblock %}
{% block content %}
<div class="container">
    <h2 class="golden-text">Create Event</h2>
    <div class="glass-card p-4">
        <form method="POST">
            <div class="row">
                <div class="col-md-6"><label>Event Type</label><select name="event_type" class="form-select"><option value="dowry">Dowry</option><option value="burial">Burial</option><option value="medical">Medical</option><option value="education">Education</option><option value="harambee">Harambee</option><option value="other">Other</option></select></div>
                <div class="col-md-6"><label>Title</label><input type="text" name="title" class="form-control" required></div>
            </div>
            <div class="mb-2"><label>Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
            <div class="row">
                <div class="col-md-4"><label>Target (KES)</label><input type="number" name="target_amount" class="form-control" step="0.01" required></div>
                <div class="col-md-4"><label>Event Date</label><input type="datetime-local" name="event_date" class="form-control" required></div>
                <div class="col-md-4"><label>Deadline</label><input type="datetime-local" name="deadline" class="form-control" required></div>
            </div>
            <div class="mb-2"><label>Picture URL</label><input type="url" name="picture_url" class="form-control"></div>
            <div class="mb-2"><label>Background Image URL</label><input type="url" name="background_image_url" class="form-control"></div>
            <h5 class="golden-text mt-3">Payment Details</h5>
            <div class="mb-2"><label>Account Name (required)</label><input type="text" name="account_name" class="form-control" required></div>
            <div class="row">
                <div class="col-md-3"><label>Paybill</label><input type="text" name="paybill" class="form-control"></div>
                <div class="col-md-3"><label>M-Pesa</label><input type="text" name="mpesa_number" class="form-control"></div>
                <div class="col-md-3"><label>Till</label><input type="text" name="till_number" class="form-control"></div>
                <div class="col-md-3"><label>WhatsApp</label><input type="text" name="whatsapp_contact" class="form-control"></div>
            </div>
            <div class="row">
                <div class="col-md-4"><label>Bank Name</label><input type="text" name="bank_name" class="form-control"></div>
                <div class="col-md-4"><label>Bank Account Name</label><input type="text" name="bank_account_name" class="form-control"></div>
                <div class="col-md-4"><label>Bank Account Number</label><input type="text" name="bank_account_number" class="form-control"></div>
            </div>
            <div class="mb-2"><label>Payment Instructions</label><textarea name="payment_instructions" class="form-control" rows="2"></textarea></div>
            <div class="row">
                <div class="col-md-6"><div class="form-check"><input type="checkbox" name="has_grace_period" value="1" class="form-check-input"><label>Enable Grace Period</label></div></div>
                <div class="col-md-6"><label>Grace Period (days)</label><input type="number" name="grace_period" class="form-control" value="0"></div>
            </div>
            <button type="submit" class="btn btn-gold mt-3">Create</button>
        </form>
    </div>
</div>
{% endblock %}
