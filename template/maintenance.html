<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance – GoldenVow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 2rem;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 3rem 2rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.8s ease-out;
        }
        .glass h1 {
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 1rem;
        }
        .glass .icon {
            font-size: 4rem;
            color: #D4AF37;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        .glass .message {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 1rem;
        }
        .glass .eta {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }
        .glass .support {
            color: rgba(255,255,255,0.6);
            font-size: 0.95rem;
        }
        .glass .support a {
            color: #D4AF37;
            text-decoration: none;
        }
        .glass .support a:hover {
            text-decoration: underline;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .btn-glass {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 30px;
            padding: 0.6rem 1.8rem;
            transition: 0.3s;
        }
        .btn-glass:hover {
            background: rgba(255,255,255,0.15);
            color: #D4AF37;
        }
    </style>
</head>
<body>
    <div class="glass">
        <div class="icon"><i class="fas fa-tools"></i></div>
        <h1>We'll be back soon</h1>
        <div class="message">{{ message }}</div>
        <div class="eta"><i class="fas fa-clock me-2"></i>{{ eta }}</div>
        <p class="support">
            Need help? Contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a> or 
            <a href="https://wa.me/{{ support_whatsapp|replace('+', '')|replace(' ', '') }}" target="_blank">WhatsApp</a>
        </p>
        <p class="support mt-3">
            <a href="{{ url_for('settings') }}" class="btn btn-glass"><i class="fas fa-cog me-2"></i>Admin Settings</a>
        </p>
    </div>
</body>
</html>
