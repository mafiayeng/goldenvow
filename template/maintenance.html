{% extends "base.html" %}
{% block title %}Under Maintenance{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="glass-card p-5" style="max-width:600px; margin:0 auto;">
        <h1 class="display-1">🔧</h1>
        <h2 class="golden-text">We'll Be Back Soon</h2>
        <p class="lead text-light">{{ message }}</p>
        <div class="bg-dark p-3 rounded-4 mb-3">
            <i class="bi bi-clock-history golden-text"></i>
            <span class="text-light">Estimated Return: <strong class="golden-text">{{ eta }}</strong></span>
        </div>
        <hr>
        <p class="text-muted-light small">
            We appreciate your patience. Our team is working hard to bring the platform back online.
        </p>
        <a href="{{ url_for('login') }}" class="btn btn-outline-gold mt-3">
            <i class="bi bi-shield-lock"></i> Admin Login
        </a>
    </div>
</div>
{% endblock %}
